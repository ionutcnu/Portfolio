name = "portfolio"
main = ".open-next/worker.js"
compatibility_date = "2025-11-14"
compatibility_flags = ["nodejs_compat"]

# Environment variables (values from dashboard secrets)
[vars]
GITHUB_USERNAME = "ionutcnu"

# Static assets
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "portfolio-counter"
database_id = "10a10508-24ee-4010-aa16-9598e5920506"

# Analytics Engine binding
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Note: GITHUB_TOKEN is set as a secret in Cloudflare Dashboard and will be available at runtime
